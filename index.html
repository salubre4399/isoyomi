<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>磯読み</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0E2430">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="lib/leaflet.css">
<style>
/* ------------------------------------------------------------------ tokens
   オフライン前提なのでWebフォントは使わない。見出しだけ明朝にして海図の顔にする */
:root{
  --bg:#08161D; --panel:#0E2430; --panel2:#143240; --line:#1E4252;
  --ink:#DCE8EA; --ink2:#9CB6BE; --ink3:#688793;
  --chart:#6FC0D0; --shoal:#8FD8DE; --buoy:#E5AC44; --kelp:#6FB183; --alert:#E28A6C;
  --iso1A:#E5AC44; --iso2:#E58044; --isoOther:#B98A5A;
  --earth:#3A3429; --water:#0F3444; --bed:#22302E;
  --serif:"Yu Mincho","YuMincho","Hiragino Mincho ProN","MS PMincho",serif;
  --sans:"Yu Gothic UI","Yu Gothic","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;
  --mono:"Consolas","SFMono-Regular","Menlo","MS Gothic",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:13px; line-height:1.7; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--chart); outline-offset:1px}

/* ------------------------------------------------------------------ shell */
#app{display:grid; grid-template-rows:auto 1fr; height:100%}

#top{
  display:flex; align-items:center; gap:14px; padding:0 12px; height:46px;
  background:var(--panel); border-bottom:1px solid var(--line); flex:none; z-index:800;
}
#top .brand{font-family:var(--serif); font-size:19px; font-weight:700; letter-spacing:.08em}
#top .brand small{
  font-family:var(--mono); font-size:9px; letter-spacing:.22em; color:var(--chart);
  display:block; line-height:1; margin-top:-2px;
}
#top .date{font-family:var(--mono); font-size:12px; color:var(--ink2); letter-spacing:.04em}
#top .sp{flex:1}
#top .net{font-family:var(--mono); font-size:10px; letter-spacing:.06em; padding:2px 7px; border:1px solid var(--line); border-radius:2px; color:var(--ink3)}
#top .net.on{color:var(--kelp); border-color:currentColor}
.btn{
  background:var(--panel2); border:1px solid var(--line); color:var(--ink);
  border-radius:3px; padding:5px 11px; font-size:12px; white-space:nowrap;
}
.btn:hover{border-color:var(--chart)}
.btn.pri{background:var(--chart); color:#062028; border-color:var(--chart); font-weight:700}
.btn.sm{padding:3px 8px; font-size:11px}
.btn[disabled]{opacity:.4; cursor:not-allowed}
.dirty #saveBtn{border-color:var(--buoy); color:var(--buoy)}

#body{display:grid; grid-template-columns:1fr 350px; min-height:0}
#map{width:100%; height:100%; background:#0C2A3A}

/* ------------------------------------------------------------------ side */
#side{
  background:var(--panel); border-left:1px solid var(--line);
  display:flex; flex-direction:column; min-height:0; z-index:700;
}
#tabs{display:flex; border-bottom:1px solid var(--line); flex:none}
#tabs button{
  flex:1; background:none; border:none; padding:9px 4px; font-size:12px; color:var(--ink3);
  border-bottom:2px solid transparent;
}
#tabs button[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--chart); font-weight:700}
.pane{flex:1; overflow-y:auto; overscroll-behavior:contain; display:none}
.pane[data-on]{display:block}

.sec{border-bottom:1px solid var(--line); padding:12px 14px}
.sec h3{
  margin:0 0 9px; font-size:10px; font-family:var(--mono); letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink3); font-weight:500;
  display:flex; align-items:center; gap:8px;
}
.sec h3::after{content:""; flex:1; height:1px; background:var(--line)}
.kv{display:grid; grid-template-columns:76px 1fr; gap:4px 10px; align-items:baseline}
.kv dt{font-family:var(--mono); font-size:10px; letter-spacing:.06em; color:var(--ink3); text-transform:uppercase}
.kv dd{margin:0; font-variant-numeric:tabular-nums}
.kv dd em{font-style:normal; color:var(--ink3); font-size:11px; margin-left:5px}
.tag{
  font-family:var(--mono); font-size:9px; letter-spacing:.06em; border:1px solid currentColor;
  border-radius:2px; padding:0 4px; margin-left:5px; white-space:nowrap;
}
.tag.meas{color:var(--kelp)} .tag.est{color:var(--buoy)} .tag.fc{color:var(--chart)}
.muted{color:var(--ink3)}
.warn{color:var(--alert)}
.empty{color:var(--ink3); font-size:12px; padding:22px 14px; text-align:center; line-height:1.9}

/* depth bars */
.dbar{display:grid; grid-template-columns:34px 1fr 62px; gap:8px; align-items:center; margin-bottom:4px}
.dbar .d{font-family:var(--mono); font-size:11px; color:var(--ink2); text-align:right}
.dbar .t{height:7px; background:var(--panel2); border-radius:1px; overflow:hidden}
.dbar .t i{display:block; height:100%; background:var(--chart)}
.dbar .v{font-family:var(--mono); font-size:11px; text-align:right; font-variant-numeric:tabular-nums}

/* tide */
#tideSvg{display:block; width:100%; height:auto}
.tstat{display:grid; grid-template-columns:1fr 1fr; gap:2px 10px; margin-top:8px}
.tstat div{font-family:var(--mono); font-size:11px; font-variant-numeric:tabular-nums}
.tstat span{color:var(--ink3); letter-spacing:.06em}

/* gate */
#gate{
  position:fixed; inset:0; z-index:5000; background:var(--bg);
  display:flex; align-items:center; justify-content:center; padding:24px;
}
#gate .box{width:min(340px,100%); text-align:center}
#gate .bn{font-family:var(--serif); font-size:34px; font-weight:700; letter-spacing:.1em}
#gate .bs{font-family:var(--mono); font-size:10px; letter-spacing:.3em; color:var(--chart); margin-top:-4px}
#gate p{color:var(--ink3); font-size:12.5px; margin:18px 0 14px; line-height:1.8}
#gate form{display:flex; gap:7px}
#gate input{
  flex:1; background:var(--panel); border:1px solid var(--line); border-radius:3px;
  padding:9px 11px; font-size:15px; text-align:center; letter-spacing:.1em;
}
#gate .ng{color:var(--alert); font-size:12px; margin-top:10px; min-height:1.2em}
#gate[hidden]{display:none}          /* 上の display:flex が hidden を上書きして、合言葉が合っても消えなかった */

/* sdb legend */
.sdbleg{padding:4px 10px 7px; font-size:10px; color:var(--ink3); line-height:1.6}
.sdbleg div{display:flex; align-items:center; gap:6px}
.sdbleg i{width:11px; height:11px; border-radius:2px; flex:none}

/* flow score */
.flow{display:flex; align-items:center; gap:12px; margin-bottom:10px}
.flow .num{font-family:var(--mono); font-size:30px; font-weight:600; line-height:1; color:var(--chart)}
.flow .lab{font-size:13px; font-weight:700; display:block}
.flow .sub{font-size:11px; color:var(--ink3); line-height:1.5}
.fb{display:grid; grid-template-columns:88px 1fr 34px; gap:8px; align-items:center; margin-bottom:3px}
.fb .k{font-size:11px; color:var(--ink2)}
.fb .t{height:6px; background:var(--panel2); border-radius:1px; overflow:hidden}
.fb .t i{display:block; height:100%}
.fb .v{font-family:var(--mono); font-size:10px; color:var(--ink3); text-align:right}
.fb.off .k,.fb.off .v{opacity:.45}
.hours{display:flex; gap:1px; margin-top:9px; align-items:flex-end; height:34px}
.hours span{flex:1; background:var(--shoal); opacity:.45; border-radius:1px 1px 0 0}
.hours span.pk{background:var(--buoy); opacity:1}
.hours span.now{outline:1px solid var(--buoy); outline-offset:1px}
.hourlab{display:flex; justify-content:space-between; font-family:var(--mono); font-size:9px; color:var(--ink3); margin-top:2px}

/* section（断面の見込み） */
.dir{font-size:12.5px; line-height:1.6}
.dir small{display:block; font-size:10.5px; color:var(--ink3)}
#secSvg{display:block; width:100%; height:auto; margin-top:8px}
.readcap,.matcap{font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; color:var(--ink3); margin-top:8px}
.matcap{margin-top:12px}
.reads{display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:2px; margin-top:4px}
.reads div{background:var(--panel); padding:5px 8px 6px; display:flex; flex-direction:column}
.reads .k{font-family:var(--mono); font-size:10px; color:var(--buoy); letter-spacing:.04em}
.reads .v{font-family:var(--mono); font-size:15px; font-variant-numeric:tabular-nums; line-height:1.35}
.reads .v small{font-size:10px; color:var(--ink3); margin-left:2px}
.reads .s{font-size:10px; color:var(--ink2); line-height:1.4}
.verdict{font-size:11.5px; color:var(--ink2); margin-top:9px; line-height:1.7}
.verdict b{color:var(--buoy)}
.legend{display:flex; flex-wrap:wrap; gap:3px 12px; margin-top:10px; font-size:10.5px; color:var(--ink3)}
.legend span{display:inline-flex; align-items:center; gap:5px}
.legend svg{flex:none; display:block}
.mats{display:grid; grid-template-columns:auto auto 1fr; gap:4px 9px; margin-top:4px; font-size:11.5px; align-items:baseline}
.mats .n{color:var(--ink2); white-space:nowrap}
.mats .s{font-family:var(--mono); font-size:9.5px; border:1px solid currentColor; border-radius:2px; padding:0 4px; white-space:nowrap; text-align:center}
.mats .s.ok{color:var(--kelp)} .mats .s.mid{color:var(--buoy)} .mats .s.no{color:var(--ink3)}
.mats .d{color:var(--ink3); font-size:10.5px; line-height:1.55}
.tag.iso{color:#062028; background:var(--buoy); border-color:var(--buoy)}

/* 地点の登録・地磯の印 */
#spotForm{margin-top:10px; display:flex; flex-direction:column; gap:8px}
#spotForm[hidden]{display:none}
.chk{display:flex; align-items:center; gap:7px; font-size:12px; cursor:pointer}
.chk input{margin:0; accent-color:var(--buoy)}
.chk .muted{font-size:11px}
.chk.sm{font-size:11px; gap:4px; color:var(--ink2)}

/* layer control */
#layers{
  position:absolute; top:10px; right:10px; z-index:600; background:rgba(14,36,48,.95);
  border:1px solid var(--line); border-radius:3px; width:196px; overflow:hidden;
  backdrop-filter:blur(4px);
}
#layers .lh{
  font-family:var(--mono); font-size:9px; letter-spacing:.14em; color:var(--ink3);
  padding:7px 10px 5px; text-transform:uppercase; display:flex; align-items:center;
}
#layers .lh button{background:none;border:none;color:var(--ink3);font-size:11px;margin-left:auto;padding:0}
#layers.min .lbody{display:none}
.lrow{display:flex; align-items:center; gap:7px; padding:3px 10px; font-size:11.5px}
.lrow:hover{background:var(--panel2)}
.lrow input{margin:0; accent-color:var(--chart)}
.lrow label{flex:1; cursor:pointer; display:flex; align-items:center; gap:6px}
.lrow i{width:12px; height:2px; border-radius:1px; flex:none}
.lrow .st{font-family:var(--mono); font-size:9px; color:var(--ink3)}
.lsep{height:1px; background:var(--line); margin:5px 0}

/* forms */
.form{padding:12px 14px; display:flex; flex-direction:column; gap:9px}
.f{display:flex; flex-direction:column; gap:3px}
.f label{font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; color:var(--ink3); text-transform:uppercase}
.f input,.f select,.f textarea{
  background:var(--bg); border:1px solid var(--line); border-radius:3px;
  padding:5px 7px; font-size:12.5px; width:100%;
}
.f textarea{resize:vertical; min-height:52px; font-family:inherit}
.f2{display:grid; grid-template-columns:1fr 1fr; gap:9px}
.f3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:7px}
.rowbtns{display:flex; gap:7px; margin-top:2px}
.hintline{font-size:11px; color:var(--ink3); line-height:1.65}

/* trips */
.trip{border-bottom:1px solid var(--line); padding:10px 14px}
.trip .th{display:flex; align-items:baseline; gap:8px}
.trip .td{font-family:var(--mono); font-size:12px; color:var(--chart)}
.trip .ts{font-size:12px; font-weight:700}
.trip .tb{font-family:var(--mono); font-size:10.5px; color:var(--ink3); margin-left:auto}
.trip .tm{font-size:12px; color:var(--ink2); margin-top:3px}
.trip .tc{font-size:12px; margin-top:3px}
.trip .del{background:none;border:none;color:var(--ink3);font-size:11px;padding:0}
.trip .del:hover{color:var(--alert)}

/* spots list */
.spot{display:flex; align-items:center; gap:8px; padding:8px 14px; border-bottom:1px solid var(--line)}
.spot:hover{background:var(--panel2)}
.spot .n{flex:1; font-size:12.5px; cursor:pointer}
.spot .c{font-family:var(--mono); font-size:10px; color:var(--ink3)}

/* caution */
.caution{
  margin:10px 14px 0; border:1px solid var(--line); border-left:2px solid var(--alert);
  padding:9px 11px; font-size:11.5px; color:var(--ink2); line-height:1.7; border-radius:0 3px 3px 0;
}
.caution b{color:var(--alert)}

/* toast */
#toast{
  position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
  background:var(--panel2); border:1px solid var(--line); border-radius:3px;
  padding:8px 16px; font-size:12.5px; z-index:2000; opacity:0; pointer-events:none;
  transition:opacity .18s;
}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}

/* leaflet tweaks */
.leaflet-container{background:#0C2A3A; font-family:var(--sans)}
.leaflet-control-attribution{background:rgba(8,22,29,.82)!important; color:var(--ink3)!important; font-size:10px!important}
.leaflet-control-attribution a{color:var(--ink2)!important}
.leaflet-bar a{background:var(--panel)!important; color:var(--ink)!important; border-color:var(--line)!important}
.leaflet-bar a:hover{background:var(--panel2)!important}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel); color:var(--ink); border:1px solid var(--line)}
.leaflet-popup-content{margin:9px 12px; font-size:12px; line-height:1.7}

/* mobile */
@media (max-width:820px){
  #body{grid-template-columns:1fr; grid-template-rows:1fr auto}
  #side{
    border-left:none; border-top:1px solid var(--line);
    height:min(56vh,440px); max-height:56vh;
  }
  #side.collapsed{height:42px}
  #side.collapsed .pane{display:none}
  #layers{width:168px; top:8px; right:8px}
  #top{gap:9px; padding:0 9px}
  #top .date{display:none}
}
#grip{display:none}
@media (max-width:820px){
  #grip{
    display:block; width:100%; background:var(--panel2); border:none; border-bottom:1px solid var(--line);
    height:20px; font-size:10px; color:var(--ink3); letter-spacing:.2em; padding:0; flex:none;
  }
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="5" height="5" fill="#8FD8DE" fill-opacity=".08"/>
      <line x1="0" y1="0" x2="0" y2="5" stroke="#8FD8DE" stroke-opacity=".5" stroke-width="1.1"/>
    </pattern>
  </defs>
</svg>

<div id="gate" hidden>
  <div class="box">
    <div class="bn">磯読み</div><div class="bs">ISOYOMI</div>
    <p>合言葉を入れてください。<br>知っている人だけが使う道具です。</p>
    <form id="gateForm">

             inputmode="text" placeholder="合言葉" aria-label="合言葉">

    </form>
    <div class="ng" id="gateNg"></div>

<div id="app">
  <div id="top">
    <div class="brand">磯読み<small>ISOYOMI</small></div>
    <div class="date" id="today"></div>
    <div class="sp"></div>

  <div id="body">
    <div style="position:relative">
      <div id="map"></div>

        <div class="empty" id="spotEmpty">
          地図をタップすると、その地点の<br>海岸地形・等深線までの距離・底質・<br>潮位をまとめて出します。
        </div>
        <div id="spotBody" hidden></div>
      </div>

      <div class="pane" id="paneTrip"></div>
      <div class="pane" id="paneList"></div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
"use strict";
/* =========================================================================
   磯読み — 地磯の下見と釣行記録
   データは data/*.js に同梱（file:// では fetch が使えないので script で読む）
   ========================================================================= */

const D = window.ISOYOMI_DATA || {};
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

/* ---------------------------------------------------------------- 合言葉
   本当の保護ではない（ファイルは直接落とせる）。中身は公的なオープンデータなので
   守るものは無く、これは「身内の道具」だと示すための入り口。
   合言葉を変えるには tools/set_gate.py を使う */
const GATE_HASH = "576bfa5034ae25a055a533e65097adbbcf59acc708ce64c11f28ab8b766d1877";
const GATE_KEY = "isoyomi.gate";
// file:// のときはブラウザのプロファイル（C:）に残さないよう session に置く
const gateStore = location.protocol.startsWith("http") ? window.localStorage : window.sessionStorage;

async function sha256(t) {
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, "0")).join("");
}
function gatePassed() {
  try { return gateStore.getItem(GATE_KEY) === GATE_HASH; } catch (e) { return false; }
}
async function openGate() {
  if (!GATE_HASH || gatePassed()) return true;
  const g = document.getElementById("gate");
  g.hidden = false;
  document.getElementById("gateInput").focus();
  return new Promise(res => {
    document.getElementById("gateForm").addEventListener("submit", async ev => {
      ev.preventDefault();
      const v = document.getElementById("gateInput").value.trim();
      const h = await sha256("isoyomi:" + v);
      if (h === GATE_HASH) {
        try { gateStore.setItem(GATE_KEY, GATE_HASH); } catch (e) { /* 記憶できなくても開く */ }
        g.hidden = true;
        res(true);
      } else {
        document.getElementById("gateNg").textContent = "違います";
        document.getElementById("gateInput").select();
      }
    });
  });
}

/* ---------------------------------------------------------------- 幾何 */
const R_EARTH = 6371008.8;
const rad = d => d * Math.PI / 180;

function metersPerDeg(lat) {
  return { x: 111320 * Math.cos(rad(lat)), y: 110574 };
}
function dist(lat1, lon1, lat2, lon2) {          // 平面近似。数km以内なら十分
  const m = metersPerDeg((lat1 + lat2) / 2);
  const dx = (lon2 - lon1) * m.x, dy = (lat2 - lat1) * m.y;
  return Math.sqrt(dx * dx + dy * dy);
}
function distToSeg(plat, plon, alat, alon, blat, blon) {
  const m = metersPerDeg(plat);
  const px = plon * m.x, py = plat * m.y;
  const ax = alon * m.x, ay = alat * m.y;
  const bx = blon * m.x, by = blat * m.y;
  const dx = bx - ax, dy = by - ay;
  const L2 = dx * dx + dy * dy;
  if (L2 === 0) return Math.hypot(px - ax, py - ay);
  let t = ((px - ax) * dx + (py - ay) * dy) / L2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
}
function bboxOf(geom, kind) {
  let n = -90, s = 90, e = -180, w = 180;
  const eat = p => { if (p[1] > n) n = p[1]; if (p[1] < s) s = p[1]; if (p[0] > e) e = p[0]; if (p[0] < w) w = p[0]; };
  if (kind === "point") eat(geom);
  else geom.forEach(part => part.forEach(eat));
  return [w, s, e, n];
}
function bboxHit(b, w, s, e, n) { return !(b[0] > e || b[2] < w || b[1] > n || b[3] < s); }
function inRing(lat, lon, ring) {
  let c = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const xi = ring[i][0], yi = ring[i][1], xj = ring[j][0], yj = ring[j][1];
    if (((yi > lat) !== (yj > lat)) && (lon < (xj - xi) * (lat - yi) / (yj - yi) + xi)) c = !c;
  }
  return c;
}
function inPoly(lat, lon, rings) {
  let hit = false;
  for (const r of rings) if (inRing(lat, lon, r)) hit = !hit;   // 穴も考慮した even-odd
  return hit;
}

/* ---------------------------------------------------------------- データ読込
   重いので必要になったときだけ script を差し込んで読む */
const loaded = {}, loading = {};
function need(key) {
  if (D[key]) return Promise.resolve(D[key]);
  if (loading[key]) return loading[key];
  loading[key] = new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "data/" + key + ".js";
    s.onload = () => { indexLayer(key); res(D[key]); };
    s.onerror = () => rej(new Error("data/" + key + ".js を読めません"));
    document.head.appendChild(s);
  });
  return loading[key];
}
function indexLayer(key) {
  const d = D[key];
  if (!d || loaded[key]) return;
  if (!d.features) { loaded[key] = true; return; }   // sdb.js のような索引なしのデータ
  const kind = d.kind || "line";
  d.features.forEach(f => { f._b = bboxOf(f.g, kind); });
  d._kind = kind;
  loaded[key] = true;
}
["stations", "tide"].forEach(k => { if (D[k]) loaded[k] = true; });

/* 指定範囲に入る地物を拾う */
function pick(key, w, s, e, n, limit) {
  const d = D[key];
  if (!d) return [];
  const out = [];
  for (const f of d.features) {
    if (bboxHit(f._b, w, s, e, n)) { out.push(f); if (limit && out.length >= limit) break; }
  }
  return out;
}
/* 一番近い地物と、その距離(m) */
function nearest(key, lat, lon, maxM) {
  const d = D[key];
  if (!d) return null;
  const m = metersPerDeg(lat);
  const dw = maxM / m.x, dh = maxM / m.y;
  let best = null, bestD = Infinity;
  for (const f of d.features) {
    if (!bboxHit(f._b, lon - dw, lat - dh, lon + dw, lat + dh)) continue;
    let dd = Infinity;
    if (d._kind === "point") {
      dd = dist(lat, lon, f.g[1], f.g[0]);
    } else if (d._kind === "poly") {
      if (inPoly(lat, lon, f.g)) dd = 0;
      else for (const ring of f.g) for (let i = 1; i < ring.length; i++)
        dd = Math.min(dd, distToSeg(lat, lon, ring[i - 1][1], ring[i - 1][0], ring[i][1], ring[i][0]));
    } else {
      for (const path of f.g) for (let i = 1; i < path.length; i++)
        dd = Math.min(dd, distToSeg(lat, lon, path[i - 1][1], path[i - 1][0], path[i][1], path[i][0]));
    }
    if (dd < bestD) { bestD = dd; best = f; }
  }
  return best && bestD <= maxM ? { f: best, d: bestD } : null;
}

/* ---------------------------------------------------------------- 描画 */
let redrawTimer = null;
function redraw() {
  clearTimeout(redrawTimer);
  redrawTimer = setTimeout(doRedraw, 60);
}
function drawFeature(l, f) {
  let lay;
  if (l.type === "point") lay = L.circleMarker([f.g[1], f.g[0]], Object.assign({ renderer: canvasR }, l.style(f)));
  else if (l.type === "poly") lay = L.polygon(f.g.map(r => r.map(p => [p[1], p[0]])), Object.assign({ renderer: canvasR }, l.style(f)));
  else lay = L.polyline(f.g.map(p => p.map(q => [q[1], q[0]])), Object.assign({ renderer: canvasR }, l.style(f)));
  if (l.pop) lay.bindPopup(l.pop(f));
  drawPane.addLayer(lay);
}
function doRedraw() {
  drawPane.clearLayers();
  const z = map.getZoom(), b = map.getBounds();
  const w = b.getWest(), s = b.getSouth(), e = b.getEast(), n = b.getNorth();
  for (const l of LAYERS) {
    const st = $("#st_" + l.key);
    if (!l.on) { st.textContent = ""; continue; }
    if (l.chunked) {                               // 区画に分けたデータ：見ている範囲の区画だけ読む
      if (z < l.minZ) { st.textContent = "z" + l.minZ; continue; }
      const keys = chunkKeysIn(l.key, w, s, e, n);
      if (!keys) { st.textContent = "…"; continue; }
      const miss = keys.filter(k => !D[k]);
      miss.forEach(k => need(k).then(redraw).catch(() => { st.textContent = "×"; }));
      const seen = new Set();
      for (const k of keys) if (D[k]) for (const f of pick(k, w, s, e, n, 3000)) {
        if (seen.has(f.i)) continue;                 // 区画をまたぐ地物は両方の区画に入っている
        seen.add(f.i);
        drawFeature(l, f);
      }
      st.textContent = miss.length ? "…" : String(seen.size);
      continue;
    }
    if (!D[l.key]) { st.textContent = "…"; need(l.key).then(redraw).catch(() => { st.textContent = "×"; }); continue; }
    if (z < l.minZ) { st.textContent = "z" + l.minZ; continue; }
    const feats = pick(l.key, w, s, e, n, 3000);
    st.textContent = feats.length ? String(feats.length) : "0";
    for (const f of feats) drawFeature(l, f);
  }
}

/* 大きい線データ（岩に接する海岸は全部で約11MB）は 0.5°ごとに分けてある（tools/split_layer.py）。
   見ている範囲・タップした地点のまわりの区画だけ読む */
function chunkKeysIn(base, w, s, e, n) {
  const ik = base + "/index";
  if (!D[ik]) { need(ik).then(redraw).catch(() => {}); return null; }
  const idx = D[ik], c = idx.cell, have = new Set(idx.keys), out = [];
  for (let la = Math.floor(s / c) * c; la <= n + 1e-9; la += c) {
    for (let lo = Math.floor(w / c) * c; lo <= e + 1e-9; lo += c) {
      const key = la.toFixed(1) + "_" + lo.toFixed(1);
      if (have.has(key)) out.push(base + "/" + key);
    }
  }
  return out;
}
async function chunksNear(base, lat, lon, radiusM) {
  await need(base + "/index").catch(() => null);
  const m = metersPerDeg(lat), dw = radiusM / m.x, dh = radiusM / m.y;
  const keys = chunkKeysIn(base, lon - dw, lat - dh, lon + dw, lat + dh) || [];
  await Promise.all(keys.map(k => need(k).catch(() => null)));
  return keys.filter(k => D[k]);
}
function nearestIn(keys, lat, lon, maxM) {
  let best = null;
  for (const k of keys || []) {
    const r = nearest(k, lat, lon, maxM);
    if (r && (!best || r.d < best.d)) best = r;
  }
  return best;
}

/* ---------------------------------------------------------------- 潮位 */
const STATIONS = (D.stations && D.stations.features) || [];
const TIDE = D.tide || { days: {} };

function nearestStation(lat, lon) {
  let best = null, bd = Infinity;
  for (const s of STATIONS) {
    const d = dist(lat, lon, s.lat, s.lon);
    if (d < bd) { bd = d; best = s; }
  }
  return best ? { s: best, d: bd } : null;
}
function mmdd(dt) {
  return String(dt.getMonth() + 1).padStart(2, "0") + String(dt.getDate()).padStart(2, "0");
}
function tideDay(code, dt) {
  const y = (TIDE.days || {})[code];
  return y ? y[mmdd(dt)] : null;
}
function hhmm(min) { return String(Math.floor(min / 60)).padStart(2, "0") + ":" + String(min % 60).padStart(2, "0"); }

/* 毎時値を線形補間して任意時刻の潮位を出す */
function tideAt(day, dt) {
  if (!day) return null;
  const h = dt.getHours() + dt.getMinutes() / 60;
  const i = Math.floor(h), t = h - i;
  const a = day.h[Math.min(i, 23)], b = day.h[Math.min(i + 1, 23)];
  return a + (b - a) * t;
}
function tideRateAt(day, dt) {           // cm/h。流れの目安
  if (!day) return null;
  const i = Math.min(Math.max(dt.getHours(), 0), 22);
  return day.h[i + 1] - day.h[i];
}

function drawTide(day, dt, svg) {
  const W = 320, H = 120, L0 = 26, R0 = 8, T0 = 8, curveH = 62, gap = 8, barH = 26;
  const hs = day.h, ds = [];
  for (let i = 0; i < 23; i++) ds.push(hs[i + 1] - hs[i]);
  const lo = Math.min(...hs), hi = Math.max(...hs);
  const pad = Math.max(10, (hi - lo) * .12);
  const y0 = lo - pad, y1 = hi + pad;
  const X = i => L0 + (W - L0 - R0) * i / 23;
  const Y = v => T0 + curveH * (1 - (v - y0) / (y1 - y0));
  const barTop = T0 + curveH + gap, mid = barTop + barH / 2;
  const maxD = Math.max(10, ...ds.map(Math.abs));
  const ink3 = CSSV("--ink3"), chart = CSSV("--chart"), shoal = CSSV("--shoal"), buoy = CSSV("--buoy"), line = CSSV("--line");
  let o = "";
  // 目盛
  [lo, hi].forEach(v => {
    o += `<line x1="${L0}" y1="${Y(v)}" x2="${W - R0}" y2="${Y(v)}" stroke="${line}" stroke-width="1"/>`;
    o += `<text x="${L0 - 4}" y="${Y(v) + 3}" text-anchor="end" fill="${ink3}" font-family="Consolas,monospace" font-size="8">${v}</text>`;
  });
  // 潮位曲線
  const pts = hs.map((v, i) => X(i) + "," + Y(v)).join(" ");
  o += `<polygon points="${L0},${Y(y0)} ${pts} ${W - R0},${Y(y0)}" fill="${shoal}" fill-opacity=".13"/>`;
  o += `<polyline points="${pts}" fill="none" stroke="${chart}" stroke-width="1.8" stroke-linejoin="round"/>`;
  // 満干潮
  (day.H || []).forEach(p => { o += `<circle cx="${X(p[0] / 60)}" cy="${Y(p[1])}" r="2.6" fill="${chart}"/>`; });
  (day.L || []).forEach(p => { o += `<circle cx="${X(p[0] / 60)}" cy="${Y(p[1])}" r="2.6" fill="none" stroke="${chart}" stroke-width="1.4"/>`; });
  // 変化率
  o += `<line x1="${L0}" y1="${mid}" x2="${W - R0}" y2="${mid}" stroke="${line}" stroke-width="1"/>`;
  const peak = ds.reduce((m, v, i) => Math.abs(v) > Math.abs(ds[m]) ? i : m, 0);
  ds.forEach((v, i) => {
    const hgt = Math.abs(v) / maxD * (barH / 2);
    o += `<rect x="${X(i) + 1.4}" y="${v >= 0 ? mid - hgt : mid}" width="${(W - L0 - R0) / 24 - 2.8}" ` +
         `height="${Math.max(hgt, .7)}" fill="${i === peak ? buoy : shoal}" fill-opacity="${i === peak ? 1 : .5}"/>`;
  });
  o += `<text x="${L0}" y="${barTop - 1}" fill="${ink3}" font-family="Consolas,monospace" font-size="8" letter-spacing=".06em">変化率 cm/h</text>`;
  // 今
  const nowX = X(dt.getHours() + dt.getMinutes() / 60);
  o += `<line x1="${nowX}" y1="${T0}" x2="${nowX}" y2="${barTop + barH}" stroke="${buoy}" stroke-width="1" stroke-dasharray="3 2"/>`;
  // 時刻
  [0, 6, 12, 18, 23].forEach(i => {
    o += `<text x="${X(i)}" y="${barTop + barH + 10}" text-anchor="middle" fill="${ink3}" font-family="Consolas,monospace" font-size="8">${i}</text>`;
  });
  svg.setAttribute("viewBox", `0 0 ${W} ${barTop + barH + 14}`);
  svg.innerHTML = o;
}

/* ---------------------------------------------------------------- 標高（陸か海か）
   地理院の標高タイルは海の上が欠測になる。これで陸と海を分ける。
   5m格子（DEM5A→5B）を優先し、無いところは10m格子（DEM10B）。10m格子は汀線を海側へ
   10mほどにじませるので、5m格子のある区画で10m格子だけが2m未満の陸と言う画素は海とみなす。
   一度開いた場所のタイルは Service Worker が残すので、圏外でもそこは分かる */
const DEM_URL = "https://cyberjapandata.gsi.go.jp/xyz/";
const DEM_FINE = [["dem5a_png", 15], ["dem5b_png", 15]];
const DEM_COARSE = ["dem_png", 14];
const DEM_KEEP = 160;                              // 1枚256KB。これを超えたら古いものから捨てる
const SNAP_M = 60;                                 // 汀線からこれ以内の陸は「岩の上」とみなす
const demReady = new Map();                        // 読めたタイル。null＝その区画にタイルが無い
const demLoading = new Map();
let demCanvas = null;

function tileXY(lat, lon, z) {
  const n = 2 ** z, s = Math.sin(rad(lat));
  return { x: (lon + 180) / 360 * n, y: (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * n };
}

async function decodeDem(blob) {
  let bmp;
  try { bmp = await createImageBitmap(blob, { colorSpaceConversion: "none", premultiplyAlpha: "none" }); }
  catch (e) { bmp = await createImageBitmap(blob); }
  if (!demCanvas) {
    demCanvas = typeof OffscreenCanvas === "function" ? new OffscreenCanvas(256, 256) : document.createElement("canvas");
    demCanvas.width = 256; demCanvas.height = 256;
  }
  const g = demCanvas.getContext("2d", { willReadFrequently: true });
  g.clearRect(0, 0, 256, 256);
  g.drawImage(bmp, 0, 0);
  if (bmp.close) bmp.close();
  const px = g.getImageData(0, 0, 256, 256).data;
  const v = new Float32Array(65536);
  let any = false;
  for (let i = 0, j = 0; i < 65536; i++, j += 4) {
    const x = px[j] * 65536 + px[j + 1] * 256 + px[j + 2];
    if (x === 0x800000 || px[j + 3] === 0) v[i] = NaN;         // 欠測（海）
    else { v[i] = (x > 0x800000 ? x - 0x1000000 : x) * 0.01; any = true; }
  }
  return { v, any };
}

/* 1枚読む。{v, any}＝読めた ／ null＝タイルが無い（海だけの区画など） ／ undefined＝通信できない */
function demTile(kind, z, tx, ty) {
  const key = kind + "/" + z + "/" + tx + "/" + ty;
  if (demReady.has(key)) {                         // 使ったものは新しい扱いにする
    const t = demReady.get(key);
    demReady.delete(key); demReady.set(key, t);
    return Promise.resolve(t);
  }
  if (demLoading.has(key)) return demLoading.get(key);
  const ctl = typeof AbortController === "function" ? new AbortController() : null;
  const timer = ctl ? setTimeout(() => ctl.abort(), 8000) : null;
  const p = fetch(`${DEM_URL}${kind}/${z}/${tx}/${ty}.png`, ctl ? { signal: ctl.signal } : {})
    .then(r => r.ok ? r.blob().then(decodeDem) : (r.status === 404 ? null : undefined))   // 504 は圏外
    .catch(() => undefined)
    .then(res => {
      clearTimeout(timer);
      demLoading.delete(key);
      if (res !== undefined) {
        demReady.set(key, res);
        if (demReady.size > DEM_KEEP) demReady.delete(demReady.keys().next().value);
      }
      return res;
    });
  demLoading.set(key, p);
  return p;
}

/* 範囲のタイルをそろえる。1枚でも通信できなければ false */
async function demLoad(kind, z, lat, lon, radiusM) {
  const m = metersPerDeg(lat);
  const a = tileXY(lat + radiusM / m.y, lon - radiusM / m.x, z);
  const b = tileXY(lat - radiusM / m.y, lon + radiusM / m.x, z);
  const jobs = [];
  for (let tx = Math.floor(a.x); tx <= Math.floor(b.x); tx++) {
    for (let ty = Math.floor(a.y); ty <= Math.floor(b.y); ty++) jobs.push(demTile(kind, z, tx, ty));
  }
  return (await Promise.all(jobs)).every(r => r !== undefined);
}
/* 地点のまわりをそろえる。細かい格子は汀線探しに、10m格子は3km先までの見通しに使う */
async function demPrepare(lat, lon) {
  const ok = await Promise.all(DEM_FINE.map(([k, z]) => demLoad(k, z, lat, lon, 450))
    .concat(demLoad(DEM_COARSE[0], DEM_COARSE[1], lat, lon, RAY_MAX + 200)));
  return ok.every(Boolean);
}

/* 読んであるタイルから標高(m)を引く。欠測・タイル無しは null、まだ読んでいなければ undefined */
function demAt(kind, z, lat, lon) {
  const t = tileXY(lat, lon, z), tx = Math.floor(t.x), ty = Math.floor(t.y);
  const tile = demReady.get(kind + "/" + z + "/" + tx + "/" + ty);
  if (!tile) return tile;
  const v = tile.v[Math.min(255, Math.floor((t.y - ty) * 256)) * 256 + Math.min(255, Math.floor((t.x - tx) * 256))];
  return Number.isNaN(v) ? null : v;
}
function demCovered(kind, z, lat, lon) {         // その区画にこの格子のデータがあるか
  const t = tileXY(lat, lon, z);
  const tile = demReady.get(kind + "/" + z + "/" + Math.floor(t.x) + "/" + Math.floor(t.y));
  return !!(tile && tile.any);
}
function elevAt(lat, lon) {                      // 細かい格子から順に、最初に値のあるもの
  for (const [k, z] of DEM_FINE) {
    const v = demAt(k, z, lat, lon);
    if (v != null) return { h: v, kind: k };
  }
  const v = demAt(DEM_COARSE[0], DEM_COARSE[1], lat, lon);
  return v != null ? { h: v, kind: DEM_COARSE[0] } : null;
}
function isSea(lat, lon) {
  const e = elevAt(lat, lon);
  if (!e) return true;
  return e.kind === DEM_COARSE[0] && e.h < 2.0 && DEM_FINE.some(([k, z]) => demCovered(k, z, lat, lon));
}

/* (ox,oy)[m] から方位 b へ進み、海かどうかが want になる最初の距離。近くは1m、120mより先は4m刻み */
function marchTo(sea, ox, oy, b, maxM, want) {
  const ux = Math.sin(b), uy = Math.cos(b);
  for (let d = 0; d <= maxM; d += d < 120 ? 1 : 4) if (sea(ox + ux * d, oy + uy * d) === want) return d;
  return null;
}

/* 足元が陸か海か。陸で汀線から SNAP_M 以内なら、汀線に立ったとして立ち位置を決める。
   向きは「海が近くて長く続く方角」の平均（重み＝海の続く長さ×近さ）。その向きで最初に海になる手前に立つ */
function footing(lat, lon) {
  const m = metersPerDeg(lat);
  const sea = (x, y) => isSea(lat + y / m.y, lon + x / m.x);
  const here = sea(0, 0);
  let near = null;                                 // いちばん近い汀線（陸なら海へ、海なら陸へ）
  for (let i = 0; i < 144; i++) {
    const b = 2 * Math.PI * i / 144;
    const d = marchTo(sea, 0, 0, b, 400, !here);
    if (d != null && (!near || d < near.d)) near = { d, b };
  }
  if (here) return { sea: true, shoreD: near ? near.d : null, shoreB: near ? near.b : null };
  const e = elevAt(lat, lon);
  const out = { sea: false, h: e ? e.h : null, shoreD: near ? near.d : null };
  if (!near || near.d > SNAP_M) return out;
  let vx = 0, vy = 0;
  for (let i = 0; i < 72; i++) {
    const b = 2 * Math.PI * i / 72, ux = Math.sin(b), uy = Math.cos(b);
    const d0 = marchTo(sea, 0, 0, b, 120, true);
    if (d0 == null) continue;
    let run = 800;
    for (let d = 4; d <= 800; d += 4) if (!sea(ux * (d0 + d), uy * (d0 + d))) { run = d; break; }
    const w = run * Math.exp(-d0 / 40);
    vx += ux * w; vy += uy * w;
  }
  let tb = Math.atan2(vx, vy);
  let d0 = marchTo(sea, 0, 0, tb, 120, true);
  if (d0 == null) { tb = near.b; d0 = near.d; }    // 平均の向きが陸を向いた（入り組んだ地形）
  const s = Math.max(0, d0 - 1);
  out.stand = { lat: lat + Math.cos(tb) * s / m.y, lon: lon + Math.sin(tb) * s / m.x };
  out.bearing = (tb * 180 / Math.PI + 360) % 360;
  return out;
}

/* ---------------------------------------------------------------- 流れの効き
   流速そのものは出せない。出しているのは「流れが出やすい条件が揃っているか」。
   干満差ではなく潮位の変化率を使うのが要点。大潮でも満潮・干潮の前後は止まる。 */
const FLOW_W = { tide: .35, narrow: .30, terrain: .20, current: .15 };
const RATE_MAX = {};

function annualMaxRate(code) {          // その験潮所の年間最大変化率。大潮小潮を測る物差しになる
  if (RATE_MAX[code] != null) return RATE_MAX[code];
  const y = (TIDE.days || {})[code] || {};
  let mx = 1;
  for (const k in y) {
    const h = y[k].h;
    for (let i = 0; i < 23; i++) { const v = Math.abs(h[i + 1] - h[i]); if (v > mx) mx = v; }
  }
  return (RATE_MAX[code] = mx);
}

/* 周りの海岸線をローカル平面(m)の線分にして集める。砂浜も護岸も陸なので両方使う */
function coastSegs(lat, lon, radiusM) {
  const m = metersPerDeg(lat);
  const dw = radiusM / m.x, dh = radiusM / m.y;
  const segs = [];
  for (const key of ["coast_iso", "coast_other"]) {
    const d = D[key];
    if (!d) continue;
    for (const f of d.features) {
      if (!bboxHit(f._b, lon - dw, lat - dh, lon + dw, lat + dh)) continue;
      for (const path of f.g) {
        for (let i = 1; i < path.length; i++) {
          const a = path[i - 1], b = path[i];
          segs.push([(a[0] - lon) * m.x, (a[1] - lat) * m.y, (b[0] - lon) * m.x, (b[1] - lat) * m.y]);
        }
      }
    }
  }
  return segs;
}

/* (ox,oy) から (dx,dy) 方向に飛ばして、最初に陸へ当たるまでの距離 */
function rayCast(ox, oy, dx, dy, segs, maxM) {
  let best = maxM;
  for (const g of segs) {
    const ex = g[2] - g[0], ey = g[3] - g[1];
    const den = dx * ey - dy * ex;
    if (den > -1e-9 && den < 1e-9) continue;
    const qx = g[0] - ox, qy = g[1] - oy;
    const t = (qx * ey - qy * ex) / den;
    if (t <= 0 || t >= best) continue;
    const u = (qx * dy - qy * dx) / den;
    if (u >= 0 && u <= 1) best = t;
  }
  return best;
}

const RAYS = 36, RAY_MAX = 3000;
/* 海岸線の線だけで測る古いやり方。陸と海を区別できないので、標高タイルが取れないときの
   予備にだけ使う（海岸線から40m以内をタップしたときに限る） */
function geometryCoast(lat, lon) {
  const segs = coastSegs(lat, lon, RAY_MAX);
  if (!segs.length) return null;
  const cast = (ox, oy) => {
    const h = [];
    for (let i = 0; i < RAYS; i++) {
      const b = 2 * Math.PI * i / RAYS;
      h.push(rayCast(ox, oy, Math.sin(b), Math.cos(b), segs, RAY_MAX));
    }
    return h;
  };
  const hit = cast(0, 0);

  /* 岬度：400m以内に陸がある方角の割合。少ないほど突き出ている（地点そのもので測る） */
  const landFrac = hit.filter(h => h < 400).length / RAYS;
  const cape = Math.max(0, Math.min(1, (0.55 - landFrac) / 0.42));

  /* 狭窄度は「目の前の海が絞られているか」。岸の上で測ると陸側のレイが即当たって
     どこでも狭くなってしまうので、いったん海側へ出てから測る */
  let sx = 0, sy = 0;
  for (let i = 0; i < RAYS; i++) {
    if (hit[i] < 300) { const b = 2 * Math.PI * i / RAYS; sx += Math.sin(b); sy += Math.cos(b); }
  }
  const landLen = Math.hypot(sx, sy);
  let ox = 0, oy = 0, offset = 0, seaward = null;
  if (landLen > 1e-6) {
    const ux = -sx / landLen, uy = -sy / landLen;          // 陸の平均方向の逆＝沖
    seaward = (Math.atan2(ux, uy) * 180 / Math.PI + 360) % 360;
    offset = Math.min(180, rayCast(0, 0, ux, uy, segs, RAY_MAX) * 0.5);
    ox = ux * offset; oy = uy * offset;
  }
  const hit2 = offset > 20 ? cast(ox, oy) : hit;

  let width = Infinity, axis = 0;
  for (let i = 0; i < RAYS / 2; i++) {
    const a = hit2[i], b = hit2[i + RAYS / 2];
    if (a >= RAY_MAX || b >= RAY_MAX) continue;            // 片側が開いていれば水道ではない
    if (a < 25 || b < 25) continue;                        // 岩の隙間は水道ではない
    if (a + b < width) { width = a + b; axis = 360 * i / RAYS; }
  }
  const narrow = width === Infinity ? 0 : Math.max(0, Math.min(1, 1 - (width - 200) / 2600));
  // 軸は水道に沿う向き（流れの向き）で返す。上で求めた axis は横断の向き
  return { method: "coast", narrow, cape, width, landFrac, axis: (axis + 90) % 360, offset, seaward };
}

const angDiff = (a, b) => { const d = Math.abs((((a - b) % 360) + 360) % 360); return d > 180 ? 360 - d : d; };

/* 標高で分けた海の上だけを測る。72方位それぞれ、海がどこまで続くか（向こう岸まで）。
   onShore＝汀線に立っている（または岸から60m以内の海）。このときの水道の狭さは
   「沖の向き±30°の向こう岸までの距離」で測る。岸に沿った方角で測ると、入り江の幅を水道と取り違える */
const OPEN_M = 400, FAR_STEP = 16;
function geometryDem(lat, lon, onShore) {
  const m = metersPerDeg(lat);
  const sea = (x, y) => isSea(lat + y / m.y, lon + x / m.x);
  const runs = [];
  for (let i = 0; i < 72; i++) {
    const b = 2 * Math.PI * i / 72, ux = Math.sin(b), uy = Math.cos(b);
    let d0 = null;                                 // 30m以内に海が無い＝陸の方角。数えない
    for (let d = 0; d <= 30; d++) if (sea(ux * d, uy * d)) { d0 = d; break; }
    if (d0 == null) { runs.push({ deg: i * 5, d0: null, run: 0, hit: true }); continue; }
    let run = RAY_MAX - d0, hit = false, landN = 0;
    for (let d = d0 + FAR_STEP; d <= RAY_MAX; d += FAR_STEP) {
      if (sea(ux * d, uy * d)) { landN = 0; continue; }
      if (++landN >= 2) { run = d - FAR_STEP - d0; hit = true; break; }   // 1点だけの岩は向こう岸と見ない
    }
    runs.push({ deg: i * 5, d0, run, hit });
  }
  const seaRuns = runs.filter(r => r.d0 != null);
  if (!seaRuns.length) return null;
  /* 岬度：400m以上海が開けている方角の割合。まっすぐな岸でおよそ半分、岬の先ほど多い */
  const openFrac = seaRuns.filter(r => r.run >= OPEN_M).length / runs.length;
  const cape = Math.max(0, Math.min(1, (openFrac - 0.25) / 0.5));
  let sx = 0, sy = 0;
  for (const r of seaRuns) { sx += Math.sin(rad(r.deg)) * r.run; sy += Math.cos(rad(r.deg)) * r.run; }
  const seaward = (Math.atan2(sx, sy) * 180 / Math.PI + 360) % 360;
  let width = Infinity, axis = (seaward + 90) % 360;
  if (onShore) {
    const fars = seaRuns.filter(r => angDiff(r.deg, seaward) <= 30)
      .map(r => r.hit ? r.d0 + r.run : Infinity).sort((a, b) => a - b);
    if (fars.length) width = fars[Math.floor(fars.length / 2)];      // 中央値
  } else {
    for (let i = 0; i < 36; i++) {                 // 沖の点では、この点を通る一番狭い横断
      const a = runs[i], b = runs[i + 36];
      if (a.d0 == null || b.d0 == null || !a.hit || !b.hit) continue;
      const wa = a.d0 + a.run, wb = b.d0 + b.run;
      if (wa < 25 || wb < 25) continue;            // 岩の隙間は水道ではない
      if (wa + wb < width) { width = wa + wb; axis = (a.deg + 90) % 360; }
    }
  }
  const narrow = width === Infinity ? 0 : Math.max(0, Math.min(1, 1 - (width - 200) / 2600));
  return { method: "dem", how: onShore ? "sector" : "cross", narrow, cape, width, openFrac, seaward, axis };
}

/* 20m→50m の間隔。狭いほど急に落ちている＝瀬の縁で流れが増す */
function steepness(dd) {
  const a = dd[20], b = dd[50];
  if (a === undefined || b === undefined || a === Infinity || b === Infinity) return null;
  return Math.max(0, Math.min(1, 1 - (b - a) / 2500));
}

function flowScore(geo, steep, day, hourFrac, code, current) {
  const parts = {};
  if (day && code) {
    const i = Math.min(Math.max(Math.floor(hourFrac), 0), 22);
    const rate = Math.abs(day.h[i + 1] - day.h[i]);
    parts.tide = Math.min(1, rate / (0.85 * annualMaxRate(code)));
  }
  if (geo) {
    parts.narrow = geo.narrow;
    const t = [geo.cape];
    if (steep != null) t.push(steep);
    parts.terrain = t.reduce((a, b) => a + b, 0) / t.length;
  }
  if (current && current.v != null) {
    let c = Math.min(1, current.v / 0.7);
    if (current.dir != null && geo) {              // 水道の軸に沿った流れほど効く
      c *= 0.5 + 0.5 * Math.abs(Math.cos((current.dir - geo.axis) * Math.PI / 180));
    }
    parts.current = c;
  }
  let sum = 0, wsum = 0;
  for (const k in FLOW_W) if (parts[k] != null) { sum += FLOW_W[k] * parts[k]; wsum += FLOW_W[k]; }
  return { score: wsum ? sum / wsum : null, parts };
}

const FLOW_LABEL = v => v == null ? "—" : v >= .72 ? "よく効く" : v >= .52 ? "効く" : v >= .32 ? "ふつう" : "弱い";

/* 地形の測り方を一行で。標高で測れたか、海岸線だけの予備か */
function geoLine(geo, foot) {
  if (!geo) return "近くに海岸線データがない";
  if (geo.method === "dem") {
    return (geo.how === "sector"
        ? `沖（${dirName(geo.seaward)}）±30°の向こう岸まで ${geo.width === Infinity ? "3km以上" : Math.round(geo.width) + " m"}`
        : `この点を通る一番狭い横断 ${geo.width === Infinity ? "3km以内で絞られていない" : Math.round(geo.width) + " m"}`) +
      `／400m以上海が開けている方角 ${Math.round(geo.openFrac * 100)}%<span class="tag meas">DEM</span>` +
      (foot && foot.stand ? "<br>岩の上をタップしたので、汀線（地図の小さな点）に立ったとして測った" : "");
  }
  return `目の前の海の一番狭い横断 ${geo.width === Infinity ? "3km以内で絞られていない" : Math.round(geo.width) + " m"}` +
    `（沖へ${Math.round(geo.offset)}m出て測定）／400m以内に陸がある方角 ${Math.round(geo.landFrac * 100)}%<br>` +
    `<span class="warn">陸と海の区別には通信が要る。</span>いまは海岸線の線だけで測った値`;
}

let lastAnalysis = null;
function renderFlow() {
  const box = document.getElementById("flowBox");
  if (!box || !lastAnalysis) return;
  const { geo, steep, day, code, foot, mode } = lastAnalysis;
  if (mode === "inland") {
    box.innerHTML = `<div class="hintline"><b>陸の上です</b>（海まで${foot.shoreD == null ? " 400m以上" : "約 " + Math.round(foot.shoreD) + " m"}）。<br>
      流れの効きは、海の上か、汀線から${SNAP_M}m以内の岩の上をタップしたときに出します。</div>`;
    return;
  }
  if (mode === "none") {
    box.innerHTML = `<div class="hintline">陸か海か分かりません。<b>陸と海の区別には通信が要ります</b>（標高タイルを取れなかった）。<br>
      海岸線から40m以内をタップすれば、海岸線だけで測った値を出します。</div>`;
    return;
  }
  const now = new Date();
  const cur = (lastMarine && cursor && Math.abs(lastMarine.lat - cursor.lat) < 1e-6
               && Math.abs(lastMarine.lon - cursor.lon) < 1e-6)
    ? { v: lastMarine.current, dir: lastMarine.currentDir } : null;
  const f = flowScore(geo, steep, day, now.getHours() + now.getMinutes() / 60, code, cur);
  const hourly = [];
  for (let h = 0; h < 24; h++) hourly.push(flowScore(geo, steep, day, h, code, cur).score || 0);
  const pk = hourly.indexOf(Math.max(...hourly));
  const pct = f.score == null ? null : Math.round(f.score * 100);
  const COL = { tide: "var(--chart)", narrow: "var(--shoal)", terrain: "var(--kelp)", current: "var(--buoy)" };
  const bar = (k, label) => {
    const v = f.parts[k];
    return `<div class="fb${v == null ? " off" : ""}"><span class="k">${label}</span>` +
      `<span class="t"><i style="width:${v == null ? 0 : Math.round(v * 100)}%;background:${COL[k]}"></i></span>` +
      `<span class="v">${v == null ? "—" : v.toFixed(2)}</span></div>`;
  };
  box.innerHTML = `
    <div class="flow"><span class="num">${pct == null ? "—" : pct}</span>
      <span><span class="lab">${FLOW_LABEL(f.score)}</span>
      <span class="sub">いまの時刻で。今日の山は <b style="color:var(--buoy)">${pk}時台</b></span></span></div>
    ${bar("tide", "潮の動き")}${bar("narrow", "水道の狭さ")}
    ${bar("terrain", "岬・瀬の張り")}${bar("current", "海流モデル")}
    <div class="hours">${hourly.map((v, h) =>
      `<span class="${h === pk ? "pk" : ""}${h === now.getHours() ? " now" : ""}" ` +
      `style="height:${Math.max(6, v * 100)}%" title="${h}時 ${Math.round(v * 100)}"></span>`).join("")}</div>
    <div class="hourlab"><span>0</span><span>6</span><span>12</span><span>18</span><span>23</span></div>
    <div class="hintline" style="margin-top:8px">
      ${geoLine(geo, foot)}<br>
      <b>これは流速ではない。</b>流れが出やすい条件が揃っているかを並べただけ。
      ${cur ? "海流モデルを含む" : "「波・風・海流を取る」を押すと海流モデルが加わる"}<span class="tag est">推定</span></div>`;
}

/* ---------------------------------------------------------------- 断面（深さの見込みを横から）
   立ち位置から沖へ切った断面。陸は標高の実測、海の中は材料の間を「見込みの幅」にする。
   材料：A＝その向きで等深線と交わる点を結んだ線 ／ B＝足元の陸の傾きを海へ延ばした線 ／
         衛星の浅場（階級） ／ 自分の実測（投げた距離のある記録）。
   どれも粗い材料なので、数字は幅で出し、推定の札をつける */
const SEC_BACK = 100, SEC_AHEAD = 200, SEC_STEP = 2;
let lastSection = null;

/* ある向きの線上で等深線と交わる点。浅い順に1本ずつ（入り組んだ線を何度またいでも最初だけ） */
function rayCross(lat, lon, brg, maxM) {
  const dl = D.depth;
  if (!dl) return [];
  const m = metersPerDeg(lat);
  const ex = Math.sin(rad(brg)) * maxM, ey = Math.cos(rad(brg)) * maxM;
  const dw = maxM / m.x, dh = maxM / m.y;
  const hits = [];
  for (const f of dl.features) {
    if (!bboxHit(f._b, lon - dw, lat - dh, lon + dw, lat + dh)) continue;
    for (const path of f.g) for (let i = 1; i < path.length; i++) {
      const ax = (path[i - 1][0] - lon) * m.x, ay = (path[i - 1][1] - lat) * m.y;
      const qx = (path[i][0] - path[i - 1][0]) * m.x, qy = (path[i][1] - path[i - 1][1]) * m.y;
      const den = ex * qy - ey * qx;
      if (den > -1e-9 && den < 1e-9) continue;
      const t = (ax * qy - ay * qx) / den;
      const u = (ax * ey - ay * ex) / den;
      if (t >= 0 && t <= 1 && u >= 0 && u <= 1) hits.push([t * maxM, f.a.depth]);
    }
  }
  hits.sort((a, b) => a[0] - b[0]);
  const out = [];
  let last = 0;
  for (const [d, z] of hits) if (z > last) { out.push([d, z]); last = z; }   // 深くなる順だけ残す
  return out;
}

/* 折れ線 pts=[[x,y],...] の x での値。範囲外は端の値 */
function lerpAt(pts, x) {
  if (x <= pts[0][0]) return pts[0][1];
  for (let i = 1; i < pts.length; i++) {
    if (x <= pts[i][0]) {
      const [x0, y0] = pts[i - 1], [x1, y1] = pts[i];
      return x1 === x0 ? y1 : y0 + (y1 - y0) * (x - x0) / (x1 - x0);
    }
  }
  return pts[pts.length - 1][1];
}

/* 衛星の浅場：断面の線上の階級。画像の画素を読むので http(s) のときだけ（file:// では読めない） */
const sdbPx = {};
async function sdbPixels(a) {
  if (sdbPx[a.name] !== undefined) return sdbPx[a.name];
  if (!location.protocol.startsWith("http")) return (sdbPx[a.name] = null);
  try {
    const img = new Image();
    img.src = a.file;
    await img.decode();
    const c = document.createElement("canvas");
    c.width = img.naturalWidth; c.height = img.naturalHeight;
    const g = c.getContext("2d", { willReadFrequently: true });
    g.drawImage(img, 0, 0);
    sdbPx[a.name] = { w: c.width, h: c.height, px: g.getImageData(0, 0, c.width, c.height).data };
  } catch (e) { sdbPx[a.name] = null; }
  return sdbPx[a.name];
}
const merc = la => Math.log(Math.tan(Math.PI / 4 + rad(la) / 2));   // 画像は EPSG:3857 で張ってある
function sdbArea(lat, lon) {
  for (const a of (D.sdb && D.sdb.areas) || []) {
    const [[s0, w0], [n0, e0]] = a.bounds;
    if (lat >= Math.min(s0, n0) && lat <= Math.max(s0, n0) && lon >= Math.min(w0, e0) && lon <= Math.max(w0, e0)) return a;
  }
  return null;
}
function sdbClass(a, P, lat, lon) {
  const [[s0, w0], [n0, e0]] = a.bounds;
  const s = Math.min(s0, n0), n = Math.max(s0, n0), w = Math.min(w0, e0), e = Math.max(w0, e0);
  const X = Math.floor((lon - w) / (e - w) * P.w);
  const Y = Math.floor((merc(n) - merc(lat)) / (merc(n) - merc(s)) * P.h);
  if (X < 0 || Y < 0 || X >= P.w || Y >= P.h) return null;
  const i = (Y * P.w + X) * 4;
  if (P.px[i + 3] < 40) return null;
  let best = null, bd = Infinity;
  D.sdb.classes.forEach((c, k) => {
    const r = parseInt(c.color.slice(1, 3), 16), g = parseInt(c.color.slice(3, 5), 16), b = parseInt(c.color.slice(5, 7), 16);
    const dd = (r - P.px[i]) ** 2 + (g - P.px[i + 1]) ** 2 + (b - P.px[i + 2]) ** 2;
    if (dd < bd) { bd = dd; best = k; }
  });
  return best;
}
/* 階級の深さの幅 [浅, 深]（m）。濁りや陸の照り返しで深場が浅く出る海域（deep_as_10plus）は、
   10〜20m を「10m以深」として扱う（鹿児島湾奥は岸から40mより沖で20〜50mの所も10〜20mに出る） */
function sdbRange(k, area) {
  const cl = D.sdb.classes;
  if (area && area.deep_as_10plus && cl[k].max > 10) return [10, Infinity];
  return [k === 0 ? 0 : cl[k - 1].max, cl[k].max >= 90 ? Infinity : cl[k].max];
}
function sdbLabel(k, area) {
  return area && area.deep_as_10plus && D.sdb.classes[k].max > 10 ? "10m以深" : D.sdb.classes[k].label;
}

/* 断面の材料をまとめる。stand={lat,lon}, brg=沖の向き(度)。標高は demPrepare 済みの範囲（半径450m）で引く */
async function sectionModel(stand, brg, ctx) {
  const m = metersPerDeg(stand.lat);
  const ux = Math.sin(rad(brg)), uy = Math.cos(rad(brg));
  const at = x => [stand.lat + uy * x / m.y, stand.lon + ux * x / m.x];

  const prof = [];                                   // -100〜+200m を2mごと。h=null は海
  let fineKind = null;
  for (let x = -SEC_BACK; x <= SEC_AHEAD; x += SEC_STEP) {
    const [la, lo] = at(x);
    const e = isSea(la, lo) ? null : elevAt(la, lo);
    if (e && x <= 0 && x >= -20 && !fineKind) fineKind = e.kind;
    prof.push([x, e ? e.h : null]);
  }
  // 足元より沖で陸が6m以上続くところ＝向こう岸。それより小さい岩は断面に描くだけ
  let seaEnd = SEC_AHEAD, runN = 0;
  for (const [x, h] of prof) {
    if (x <= 6) continue;
    if (h == null) { runN = 0; continue; }
    if (++runN >= 3) { seaEnd = x - 2 * SEC_STEP; break; }
  }
  const land = prof.filter(([x]) => x <= 0);
  const h0 = (land.slice().reverse().find(p => p[1] != null) || [0, 0])[1];

  // 足元の傾き：汀線から陸へ50m以内の最大（tools/fetch_slope.py と同じ取り方）。平らすぎれば使わない
  let slope = null, nLand = 0;
  for (const [x, h] of land) if (x < 0 && x >= -50 && h != null) {
    nLand++;
    const s = Math.atan2(h - h0, -x) * 180 / Math.PI;
    if (slope == null || s > slope) slope = s;
  }
  if (nLand < 3) slope = null;                       // 足元の陸が小さすぎる（離れ岩など）と傾きは測れない
  const flat = slope != null && slope < 2;
  if (flat) slope = null;

  const cross = rayCross(stand.lat, stand.lon, brg, 6000);
  const lineA = cross.length ? [[0, 0]].concat(cross.map(([d, z]) => [d, -z])) : null;

  let sdb = null, sdbNote = "この海域はまだ取っていない";
  const area = sdbArea(stand.lat, stand.lon);
  if (area) {
    const P = await sdbPixels(area);
    if (!P) sdbNote = location.protocol.startsWith("http") ? "画像を読めなかった" : "USBから直接開いたときは読めない（start.bat か公開版で開く）";
    else {
      sdb = [];
      for (let x = 0; x <= Math.min(SEC_AHEAD, seaEnd); x += 5) sdb.push([x, sdbClass(area, P, ...at(x))]);
      sdbNote = area.label;
    }
  }

  // 潮位（平均海面＝東京湾平均海面からの高さ m）
  let level = null, HW = null, LW = null;
  const { day, st } = ctx;
  if (day && st && st.s.datum_cm != null) {
    const base = st.s.datum_cm;
    level = (base + tideAt(day, new Date())) / 100;
    if (day.H && day.H.length) HW = (base + Math.max(...day.H.map(p => p[1]))) / 100;
    if (day.L && day.L.length) LW = (base + Math.min(...day.L.map(p => p[1]))) / 100;
  }

  // 自分の実測。立ち位置が80m以内・向きが±45°以内で、投げた距離のある記録だけ
  // 潮位（levelTP）の無い記録は、測ったときの海面の高さが分からないので打たない
  const trips = store.trips.filter(t => t.castM != null && t.depth != null && t.levelTP != null && t.standLat != null &&
      t.bearing != null && dist(stand.lat, stand.lon, t.standLat, t.standLon) < 80 && angDiff(t.bearing, brg) <= 45)
    .map(t => ({ x: t.castM, z: t.levelTP - t.depth, t }));
  const tripsNoCast = store.trips.filter(t => t.depth != null && t.castM == null &&
      dist(stand.lat, stand.lon, t.lat, t.lon) < 120).length;

  return { stand, brg, prof, h0, seaEnd, slope, flat, tanS: slope == null ? null : Math.tan(rad(slope)),
           cross, lineA, sdb, sdbArea: area, sdbNote, level, HW, LW, trips, tripsNoCast, fineKind };
}

/* 見込みの幅：A（等深線）と B（足元の傾き）の間。片方しか無ければその線だけ。値は標高（負＝水深） */
function bandAt(M, x) {
  // 足元の傾きが無く、最初の等深線も400mより遠いと、磯際を直線でつないでも意味が無い
  if (M.tanS == null && (!M.lineA || M.cross[0][0] > 400)) return null;
  const v = [];
  if (M.lineA) v.push(lerpAt(M.lineA, x));
  if (M.tanS != null) v.push(-x * M.tanS);
  return v.length ? { top: Math.max(...v), bot: Math.min(...v) } : null;
}

function svgEl(tag, a, parent) {
  const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const k in a) e.setAttribute(k, a[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function svgText(parent, x, y, s, a) {
  const t = svgEl("text", Object.assign({ x, y, fill: CSSV("--ink3"), "font-family": "Consolas,Menlo,monospace", "font-size": 8.5 }, a || {}), parent);
  t.textContent = s;
  return t;
}

/* 断面図を描く。縦の強調倍率を返す */
function drawSection(svg, M) {
  const col = CSSV, SANS = getComputedStyle(document.body).fontFamily;
  const W = 322, H = 212, L = 4, R = 30, T = 16, B = 26;
  const PW = W - L - R, PH = H - T - B;
  const xmin = -SEC_BACK, xmax = SEC_AHEAD;
  const lvl = M.level != null ? M.level : 0;
  const landH = M.prof.filter(p => p[1] != null).map(p => p[1]);
  const ymax = Math.max(8, Math.ceil(((landH.length ? Math.max(...landH) : 0) + 3) / 4) * 4);
  const deep = M.lineA ? lerpAt(M.lineA, xmax) : (M.tanS != null ? -xmax * M.tanS : -20);
  const ymin = Math.min(-24, Math.floor((deep - 3) / 5) * 5, ...M.trips.map(p => Math.floor((p.z - 3) / 5) * 5));
  const X = v => L + (v - xmin) / (xmax - xmin) * PW;
  const Y = v => T + (ymax - v) / (ymax - ymin) * PH;               // はみ出した分は clipPath で切る
  const P = (x, y) => X(x).toFixed(1) + "," + Y(y).toFixed(1);
  const halo = c => `paint-order:stroke;stroke:${c};stroke-width:3px;stroke-linejoin:round`;
  svg.innerHTML = "";
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svgEl("rect", { x: L, y: T, width: PW, height: PH }, svgEl("clipPath", { id: "secClip" }, svgEl("defs", {}, svg)));
  const g = svgEl("g", { "clip-path": "url(#secClip)" }, svg);

  const sea = [];                                    // 足元から向こう岸までの海
  for (let x = 0; x <= Math.min(xmax, M.seaEnd); x += SEC_STEP) sea.push(x);
  const xe = sea[sea.length - 1];

  svgEl("rect", { x: X(0), y: Y(lvl), width: X(xe) - X(0), height: Y(ymin) - Y(lvl), fill: col("--water") }, g);
  const bands = sea.map(x => [x, bandAt(M, x)]).filter(p => p[1]);
  if (bands.length) {
    svgEl("polygon", { points: bands.map(([x, b]) => P(x, b.bot)).join(" ") + " " + P(xe, ymin) + " " + P(0, ymin), fill: col("--bed") }, g);
    svgEl("polygon", { points: bands.map(([x, b]) => P(x, b.top)).join(" ") + " " +
                               bands.slice().reverse().map(([x, b]) => P(x, b.bot)).join(" "), fill: "url(#hatch)" }, g);
  }
  if (M.sdb) {                                       // 衛星の浅場（階級の深さの幅を薄い帯で）
    for (let i = 0; i < M.sdb.length; i++) {
      const [x, k] = M.sdb[i];
      if (k == null) continue;
      const [lo, hi] = sdbRange(k, M.sdbArea);
      const x2 = i + 1 < M.sdb.length ? M.sdb[i + 1][0] : x + 5;
      svgEl("rect", { x: X(x), y: Y(-lo), width: Math.max(1, X(x2) - X(x) - .6),
                      height: Math.max(1, Y(hi === Infinity ? ymin : -hi) - Y(-lo)), fill: D.sdb.classes[k].color, "fill-opacity": .28 }, g);
    }
  }
  if (M.lineA) svgEl("polyline", { points: sea.map(x => P(x, lerpAt(M.lineA, x))).join(" "), fill: "none", stroke: col("--chart"), "stroke-width": 1.7, "stroke-linejoin": "round" }, g);
  if (M.tanS != null) svgEl("polyline", { points: sea.map(x => P(x, -x * M.tanS)).join(" "), fill: "none", stroke: col("--kelp"), "stroke-width": 1.4, "stroke-dasharray": "4 3" }, g);
  if (M.HW != null && M.LW != null)
    svgEl("rect", { x: X(0), y: Y(M.HW), width: X(xe) - X(0), height: Math.max(1, Y(M.LW) - Y(M.HW)), fill: col("--shoal"), "fill-opacity": .1 }, g);
  svgEl("line", { x1: X(0), x2: X(xe), y1: Y(lvl), y2: Y(lvl), stroke: col("--shoal"), "stroke-width": 1.3 }, g);

  let run = [];                                      // 陸（足元の後ろ、沖の岩、向こう岸）
  const flush = () => {
    if (run.length >= 2) {
      const x0 = run[0][0], x1 = run[run.length - 1][0];
      svgEl("polygon", { points: [P(x0, ymin)].concat(run.map(([x, h]) => P(x, h)), [P(x1, ymin)]).join(" "), fill: col("--earth") }, g);
      svgEl("polyline", { points: run.map(([x, h]) => P(x, h)).join(" "), fill: "none", stroke: col("--isoOther"), "stroke-width": 1.4, "stroke-linejoin": "round" }, g);
    }
    run = [];
  };
  for (const [x, h] of M.prof) { if (h != null) run.push([x, h]); else flush(); }
  flush();
  svgEl("line", { x1: X(0), x2: X(0), y1: Y(M.h0), y2: Y(0), stroke: col("--isoOther"), "stroke-width": 1.4 }, g);

  for (let v = Math.ceil(ymin / 10) * 10; v <= ymax; v += 10) {   // 目盛り（平均海面からの高さ）
    svgEl("line", { x1: L, x2: L + PW, y1: Y(v), y2: Y(v), stroke: col("--ink3"), "stroke-opacity": v === 0 ? .5 : .2, "stroke-dasharray": v === 0 ? "none" : "2 3" }, svg);
    svgText(svg, L + PW + 4, Y(v) + 3, v === 0 ? "0" : (v > 0 ? "+" : "−") + Math.abs(v));
  }
  svgText(svg, L + PW + 4, T - 6, "m");
  svgEl("line", { x1: L, x2: L + PW, y1: T + PH, y2: T + PH, stroke: col("--line") }, svg);
  [-100, -50, 0, 50, 100, 150, 200].forEach(d => {
    svgEl("line", { x1: X(d), x2: X(d), y1: T + PH, y2: T + PH + 3, stroke: col("--ink3") }, svg);
    svgText(svg, X(d), T + PH + 12, d === 200 ? "200m" : String(Math.abs(d)), { "text-anchor": d === -100 ? "start" : d === 200 ? "end" : "middle" });
  });
  svgText(svg, L, H - 2, "← 陸", { "font-family": SANS, "font-size": 9 });
  svgText(svg, X(0), H - 2, "汀線", { "font-family": SANS, "font-size": 9, "text-anchor": "middle" });
  svgText(svg, L + PW, H - 2, "沖 →", { "font-family": SANS, "font-size": 9, "text-anchor": "end" });

  M.cross.filter(([d]) => d <= xe).forEach(([d, z]) => {           // 等深線と交わる点
    svgEl("circle", { cx: X(d), cy: Y(-z), r: 2.7, fill: col("--chart") }, svg);
    const right = X(d) < L + PW - 60;
    svgText(svg, X(d) + (right ? 5 : -5), Y(-z) - 4, `${z}m線`, { fill: col("--chart"), "font-family": SANS, "font-size": 9.5,
            "text-anchor": right ? "start" : "end", style: halo(col("--bed")) });
  });
  M.trips.forEach(p => svgEl("circle", { cx: X(p.x), cy: Y(p.z), r: 3.4, fill: col("--buoy"), stroke: col("--panel"), "stroke-width": 1.2 }, svg));
  [10, 30, 50].filter(d => d <= xe).forEach(d => {                  // 投げる距離（海面に浮き）
    const b = bandAt(M, d);
    if (b) svgEl("line", { x1: X(d), x2: X(d), y1: Y(lvl), y2: Y(b.bot), stroke: col("--buoy"), "stroke-opacity": .5, "stroke-dasharray": "1.5 2" }, svg);
    svgEl("circle", { cx: X(d), cy: Y(lvl), r: 2.4, fill: col("--buoy") }, svg);
    svgText(svg, X(d), Y(lvl) - 5, String(d), { fill: col("--buoy"), "font-size": 8, "text-anchor": "middle" });
  });
  if (M.HW != null) svgText(svg, X(xe) - 2, Y(M.HW) - 5, "海面（満〜干）", { fill: col("--ink2"), "font-family": SANS, "font-size": 8.5, "text-anchor": "end" });
  if (M.seaEnd < xmax) svgText(svg, X(M.seaEnd) - 3, T + 10, "向こうの陸", { fill: col("--ink2"), "font-family": SANS, "font-size": 8.5, "text-anchor": "end" });
  svgEl("circle", { cx: X(0), cy: Y(M.h0), r: 3.2, fill: col("--buoy"), stroke: col("--panel"), "stroke-width": 1 }, svg);
  svgText(svg, X(0) - 5, Y(M.h0) - 6, "立ち位置", { fill: col("--buoy"), "font-family": SANS, "font-size": 9, "text-anchor": "end", style: halo(col("--panel")) });
  return (PH / (ymax - ymin)) / (PW / (xmax - xmin));
}

/* 断面のまわりの文字：向き・読み取り・一言・凡例・材料 */
function sectionHtml(M) {
  const sg = v => v == null ? "—" : (v > 0.05 ? "+" : v < -0.05 ? "−" : "") + Math.abs(v).toFixed(1);
  const lvl = M.level != null ? M.level : 0;
  const num = v => v < 1 ? "1未満" : String(Math.round(v));
  const reads = [10, 30, 50].map(d => {
    if (d > M.seaEnd) return { d, far: true };
    const b = bandAt(M, d);
    const sd = M.sdb ? (M.sdb.find(p => p[0] >= d) || [])[1] : null;
    const mine = M.trips.filter(p => Math.abs(p.x - d) <= 6).map(p => lvl - p.z);
    return { d, lo: b ? lvl - b.top : null, hi: b ? lvl - b.bot : null, sd, mine };
  });
  const cells = reads.map(r => {
    if (r.far) return `<div><span class="k">${r.d}m先</span><span class="v">陸</span></div>`;
    const main = r.lo == null ? "—" : r.hi < 1 ? "1未満<small>m</small>"
      : (Math.round(r.lo) === Math.round(r.hi) ? num(r.hi) : `${num(r.lo)}〜${Math.round(r.hi)}`) + "<small>m</small>";
    const sub = [];
    if (r.sd != null) sub.push(`衛星 ${esc(sdbLabel(r.sd, M.sdbArea))}`);
    if (r.mine.length) sub.push(`実測 ${r.mine.map(v => v.toFixed(1)).join("/")}m`);
    return `<div><span class="k">${r.d}m先</span><span class="v">${main}</span>${sub.length ? `<span class="s">${sub.join("・")}</span>` : ""}</div>`;
  }).join("");

  const r30 = reads[1];
  let verdict;
  if (M.trips.length) verdict = `<b>この向きの実測が ${M.trips.length} 件ある。</b>見込みの幅より実測を信じる`;
  else if (r30.lo != null && M.lineA && M.tanS != null) {
    const ratio = r30.hi / Math.max(r30.lo, .5);
    verdict = ratio >= 2
      ? `<b>材料どうしが30m先で${ratio.toFixed(0)}倍食い違う。</b>足元の傾きと等深線が合っていない。ここは実測で決めるしかない`
      : `<b>2つの材料の差は小さい。</b>ただし、どちらも粗い材料からの推定なので、実測で確かめる値打ちはある`;
  } else if (r30.far) verdict = "30m先はもう陸（向こう岸か沖の岩）";
  else if (r30.lo == null) verdict = "<b>磯際の水深を読む材料が足りない。</b>" +
    (M.tanS == null ? "足元が平らで傾きを海へ延ばせず、等深線も遠い" : "");
  else verdict = "材料が1つしか無いので、見込みは粗い";

  const c = z => { const f = M.cross.find(q => q[1] === z); return f ? Math.round(f[0]) + "m" : "—"; };
  const mats = [
    ["陸の標高", "実測", "ok", `地理院 標高タイル（${M.fineKind === "dem_png" ? "10m" : "5m"}格子）`],
    ["等深線", M.lineA ? "粗い" : "なし", M.lineA ? "mid" : "no",
      M.lineA ? `この向きで20m線まで${c(20)}、50m線まで${c(50)}。元が500m格子なので位置は数百mずれうる` : "この向きでは等深線と交わらない"]
  ];
  if (M.c04 && M.c04.avg != null) mats.push(["沿岸メッシュ", "参考", "mid",
    `この1km区画の水深 平均${esc(M.c04.avg)}m` + (M.c04.min != null ? `・最浅${esc(M.c04.min)}m・最深${esc(M.c04.max)}m` : "（推計値のみ）") + "（1987年）"]);
  mats.push(["足元の傾き", M.slope == null ? "なし" : "推定", M.slope == null ? "no" : "mid",
    M.slope != null ? `汀線から陸へ50m以内の最大 ${M.slope.toFixed(1)}°をそのまま海へ延ばす`
    : M.flat ? "足元が平らで、傾きを海へ延ばせない" : "足元の陸の標高が取れない"]);
  mats.push(["衛星の浅場", M.sdb ? "階級" : "なし", M.sdb ? "mid" : "no", M.sdb
    ? `${esc(M.sdbNote)}（Sentinel-2）${M.sdbArea && M.sdbArea.note ? "。" + esc(M.sdbArea.note) : ""}` : esc(M.sdbNote)]);
  mats.push(["自分の実測", M.trips.length ? M.trips.length + "件" : "なし", M.trips.length ? "ok" : "no",
    M.trips.length ? "立ち位置が80m以内・向きが±45°以内の記録"
    : M.tripsNoCast ? `近くに ${M.tripsNoCast} 件あるが、投げた距離が無い` : "記録に投げた距離を入れると、ここに点で打つ"]);

  return `
    <div class="dir">${M.here === "sea" ? "最寄りの岸から、タップした点へ" : "岩の先端から"} <b>${dirName(M.brg)} ${Math.round(M.brg)}°</b> へ
      <small>縦は横の<span id="secVe">—</span>倍に強調 ・ 高さは平均海面から${M.level != null
        ? `。潮位 いま ${sg(M.level)} m（満 ${sg(M.HW)} ／ 干 ${sg(M.LW)}）` : "（潮位は出せない）"}</small></div>
    <svg id="secSvg" role="img" aria-label="立ち位置から沖へ${SEC_AHEAD}mの断面"></svg>
    <div class="readcap">${M.level != null ? "いまの潮位での水深" : "平均海面での水深（潮位が分からない）"}（見込みの幅）</div>
    <div class="reads">${cells}</div>
    <div class="verdict">${verdict}<span class="tag est">推定</span></div>
    <div class="legend">
      <span><svg width="14" height="9"><rect width="14" height="9" fill="var(--earth)"/><line x1="0" y1="1" x2="14" y2="1" stroke="var(--isoOther)" stroke-width="2"/></svg>陸（標高の実測）</span>
      <span><svg width="16" height="6"><line x1="0" y1="3" x2="16" y2="3" stroke="var(--chart)" stroke-width="1.8"/></svg>等深線を結んだ線</span>
      <span><svg width="16" height="6"><line x1="0" y1="3" x2="16" y2="3" stroke="var(--kelp)" stroke-width="1.5" stroke-dasharray="4 3"/></svg>足元の傾きを延ばした線</span>
      <span><svg width="14" height="9"><rect width="14" height="9" fill="url(#hatch)"/></svg>見込みの幅</span>
      ${M.sdb ? '<span><svg width="14" height="9"><rect width="14" height="9" fill="var(--shoal)" fill-opacity=".3"/></svg>衛星の浅場</span>' : ""}
      <span><svg width="10" height="10"><circle cx="5" cy="5" r="3" fill="var(--buoy)"/></svg>投げる距離・自分の実測</span>
    </div>
    <div class="matcap">この断面の材料</div>
    <div class="mats">${mats.map(([n, s, k, d]) => `<span class="n">${n}</span><span class="s ${k}">${s}</span><span class="d">${d}</span>`).join("")}</div>`;
}

/* 地図の上の断面の線（立ち位置から後ろ60mは破線、沖200mは実線） */
const secLayer = L.layerGroup().addTo(map);
function drawSectionLine(stand, brg) {
  secLayer.clearLayers();
  const m = metersPerDeg(stand.lat);
  const pt = x => [stand.lat + Math.cos(rad(brg)) * x / m.y, stand.lon + Math.sin(rad(brg)) * x / m.x];
  L.polyline([pt(-60), pt(0)], { color: "#E5AC44", weight: 2.4, dashArray: "5 4", interactive: false }).addTo(secLayer);
  L.polyline([pt(0), pt(SEC_AHEAD)], { color: "#8FD8DE", weight: 2.6, interactive: false }).addTo(secLayer);
  [30, 60, 100, 150].forEach(d => L.circleMarker(pt(d), { radius: 2.4, color: "#8FD8DE", weight: 1, fillOpacity: 1, interactive: false }).addTo(secLayer));
}

/* ---------------------------------------------------------------- 地磯の判定・自分の地点 */
const mySpots = L.layerGroup().addTo(map);
layerBody.insertAdjacentHTML("beforeend",
  '<div class="lsep"></div><div class="lrow"><input type="checkbox" id="b_mine" checked>' +
  '<label for="b_mine"><i style="background:#E5AC44;height:8px;width:8px;border-radius:50%"></i>自分の地点</label></div>');
$("#b_mine").addEventListener("change", e => { if (e.target.checked) mySpots.addTo(map); else map.removeLayer(mySpots); });

function drawMySpots() {
  mySpots.clearLayers();
  store.spots.forEach(s => {
    const c = s.iso ? "#E5AC44" : "#9CB6BE";
    L.circleMarker([s.lat, s.lon], { radius: 6, color: c, weight: 2, fillColor: c, fillOpacity: .35, bubblingMouseEvents: false })
      .bindTooltip(esc(s.name) + (s.iso ? "（地磯）" : ""), { direction: "top", offset: [0, -6] })
      .on("click", () => { analyze(s.lat, s.lon); showTab("paneSpot"); })
      .addTo(mySpots);
  });
}

function lineLength(f) {
  let s = 0;
  for (const p of f.g) for (let i = 1; i < p.length; i++) s += dist(p[i - 1][1], p[i - 1][0], p[i][1], p[i][0]);
  return s;
}
/* 海岸の判定。優先の順：自分の地磯 → 地理院の岩の海岸 → 海保の地磯 → 海保のそれ以外 */
function coastJudge(lat, lon, rockKeys) {
  const mine = store.spots.filter(s => s.iso).map(s => ({ s, d: dist(lat, lon, s.lat, s.lon) })).sort((a, b) => a.d - b.d)[0];
  const rock = nearestIn(rockKeys, lat, lon, 40);
  const iso = nearest("coast_iso", lat, lon, 60);
  const esi = iso || nearest("coast_other", lat, lon, 1200);
  const esiLen = esi ? lineLength(esi.f) : 0;
  const coarse = esi && esiLen > 800 ? `。海保は${(esiLen / 1000).toFixed(1)}kmを1区分で扱っていて、小さな磯は拾えない` : "";
  if (mine && mine.d <= SNAP_M) return { iso: true, html: `自分の地磯「${esc(mine.s.name)}」<span class="tag meas">登録</span>`,
    note: rock ? "地理院：岩等に接する海岸" : (esi ? `海保の分類：${esc(esi.f.f)}` : "") };
  if (rock) return { iso: true, html: `岩等に接する海岸<span class="tag meas">地理院</span>`,
    note: !esi ? "" : iso ? `海保の分類でも ${esc(esi.f.f)}` : `海保の分類では「${esc(esi.f.f)}」${coarse}` };
  if (iso) return { iso: true, html: `${esc(iso.f.f)}<span class="tag meas">海保</span>`, note: `ESI ${esc(iso.f.r || "-")}` };
  if (esi) return { iso: false, html: `<span class="muted">${esc(esi.f.f)}</span>`, note: `地磯の区分ではない${coarse}` };
  return { iso: false, html: '<span class="muted">近くに海岸線データなし</span>', note: "" };
}

/* 沿岸メッシュ（国土数値情報 C04・1987年）。利用条件が確かめられないので USB の中にだけ置く。
   公開版には無いので、読めなければ黙って飛ばす */
async function c04At(lat, lon) {
  const d = await need("local_c04").catch(() => null);
  if (!d || !d.features) return null;
  let here = null;
  const names = [];
  const m = metersPerDeg(lat), dw = 1200 / m.x, dh = 1200 / m.y;
  for (const f of d.features) {
    if (!bboxHit(f._b, lon - dw, lat - dh, lon + dw, lat + dh)) continue;
    const inside = inPoly(lat, lon, f.g);
    if (inside) here = f.a;
    (f.a.iso || []).forEach(n => { if (!names.includes(n)) { if (inside) names.unshift(n); else names.push(n); } });
  }
  names.sort((a, b) => (/港$/.test(a) ? 1 : 0) - (/港$/.test(b) ? 1 : 0));   // 港の名前は地磯の名前の候補として後ろへ
  return { here, names };
}

/* 地点の登録：名前と「地磯」の印（海保・地理院の分類より優先） */
function spotForm(lat, lon, guess) {
  const box = $("#spotForm");
  box.hidden = false;
  box.innerHTML = `
    <div class="f"><label for="sp_name">名前</label><input id="sp_name" value="${esc(guess.name)}"></div>
    <label class="chk" for="sp_iso"><input type="checkbox" id="sp_iso"${guess.iso ? " checked" : ""}>
      地磯として扱う<span class="muted">（海保・地理院の分類より優先）</span></label>
    <div class="rowbtns"><button class="btn sm pri" id="sp_ok">登録する</button><button class="btn sm" id="sp_no">やめる</button></div>`;
  $("#sp_name").focus();
  $("#sp_no").onclick = () => { box.hidden = true; };
  $("#sp_ok").onclick = () => {
    const iso = $("#sp_iso").checked;
    store.spots.push({ id: uid(), name: $("#sp_name").value.trim() || ("地磯 " + (store.spots.length + 1)),
                       lat: +lat.toFixed(5), lon: +lon.toFixed(5), iso, created: new Date().toISOString() });
    markDirty(); renderList();
    toast(iso ? "地磯として登録しました" : "登録しました");
    analyze(lat, lon);
  };
}

/* 入力された日付・時刻の潮位。潮位表の年の外なら null */
function tideAtInput(st, dateStr, timeStr) {
  if (!st || !dateStr) return null;
  const dt = new Date(dateStr + "T" + (timeStr || "12:00"));
  if (isNaN(dt)) return null;
  const dayX = tideDay(st.s.code, dt);
  if (!dayX) return null;
  const cmX = tideAt(dayX, dt);
  return { cm: Math.round(cmX), rate: tideRateAt(dayX, dt),
           levelTP: st.s.datum_cm != null ? (st.s.datum_cm + cmX) / 100 : null };
}

/* ---------------------------------------------------------------- 地点の解析 */
let cursor = null, cursorMarker = null, standMarker = null, analyzeSeq = 0;
const DEPTHS = [20, 50, 100, 150, 200];

async function analyze(lat, lon) {
  const seq = ++analyzeSeq;                        // 続けてタップされたら、前のほうの結果は捨てる
  cursor = { lat, lon };
  try {
    history.replaceState(null, "", "#" + lat.toFixed(5) + "," + lon.toFixed(5) + "," + map.getZoom());
  } catch (e) { /* file:// では失敗することがある。地点表示には影響しない */ }
  if (cursorMarker) map.removeLayer(cursorMarker);
  if (standMarker) { map.removeLayer(standMarker); standMarker = null; }
  secLayer.clearLayers();
  cursorMarker = L.circleMarker([lat, lon], {
    radius: 7, color: "#E5AC44", weight: 2, fillColor: "#E5AC44", fillOpacity: .3
  }).addTo(map);

  $("#spotEmpty").hidden = true;
  const box = $("#spotBody");
  box.hidden = false;
  box.innerHTML = '<div class="empty">調べています…</div>';

  const [, demOk, rockKeys] = await Promise.all([
    Promise.all(["coast_iso", "coast_other", "depth", "seabed", "weed", "obstruction", "fishery", "sdb"]
      .map(k => need(k).catch(() => null))),
    demPrepare(lat, lon).catch(() => false),
    chunksNear("coast_rock", lat, lon, 500).catch(() => [])      // 海をタップしたときの立ち位置（200m先まで）も入る広さ
  ]);
  if (seq !== analyzeSeq) return;

  /* 足元：陸か海か（標高タイル）。岩の上なら汀線に立ったとして、以下はそこで測る。
     標高タイルが取れないときは、海岸線から40m以内に限って海岸線だけで測る */
  let foot = null, mode;
  if (demOk) {
    foot = footing(lat, lon);
    mode = !foot.sea && !foot.stand ? "inland" : "dem";
  } else {
    mode = nearest("coast_iso", lat, lon, 40) || nearest("coast_other", lat, lon, 40) ? "coast" : "none";
  }
  const plat = foot && foot.stand ? foot.stand.lat : lat;
  const plon = foot && foot.stand ? foot.stand.lon : lon;
  if (foot && foot.stand) {
    standMarker = L.circleMarker([plat, plon], {
      radius: 4, color: "#08161D", weight: 1, fillColor: "#E5AC44", fillOpacity: 1
    }).addTo(map);
  }
  const shoreTxt = d => d == null ? "400m以上" : Math.round(d) + " m";
  const footRow = !foot
    ? `<dt>足元</dt><dd><span class="muted">陸か海か不明</span><em>標高タイルに通信が要る</em></dd>`
    : foot.sea
      ? `<dt>足元</dt><dd>海<span class="tag meas">DEM</span><em>岸まで ${shoreTxt(foot.shoreD)}</em></dd>`
      : `<dt>足元</dt><dd>陸<span class="tag meas">DEM</span><em>${foot.h != null ? "標高 " + foot.h.toFixed(1) + " m ・ " : ""}汀線まで ${shoreTxt(foot.shoreD)}</em></dd>`;

  /* 海岸 */
  const coast = nearest("coast_iso", plat, plon, 1200);
  const coastOther = coast ? null : nearest("coast_other", plat, plon, 1200);

  /* 等深線までの距離 */
  const dd = {};
  const dl = D.depth;
  if (dl) {
    const m = metersPerDeg(plat), span = 30000;
    const dw = span / m.x, dh = span / m.y;
    for (const f of dl.features) {
      const dep = f.a.depth;
      if (!bboxHit(f._b, plon - dw, plat - dh, plon + dw, plat + dh)) continue;
      let best = dd[dep] === undefined ? Infinity : dd[dep];
      for (const path of f.g) for (let i = 1; i < path.length; i++) {
        const d2 = distToSeg(plat, plon, path[i - 1][1], path[i - 1][0], path[i][1], path[i][0]);
        if (d2 < best) best = d2;
      }
      dd[dep] = best;
    }
  }

  const seabed = nearest("seabed", plat, plon, 4000);
  const weed = nearest("weed", plat, plon, 1500);
  const obst = nearest("obstruction", plat, plon, 1500);
  const fish = [];
  if (D.fishery) for (const f of D.fishery.features) {
    if (bboxHit(f._b, plon, plat, plon, plat) && inPoly(plat, plon, f.g)) fish.push(f.t);
  }

  /* 潮位 */
  const st = nearestStation(plat, plon);
  const now = new Date();
  const day = st ? tideDay(st.s.code, now) : null;

  /* 断面の立ち位置と向き。岩の上→汀線に立って沖へ ／ 岸から200m以内の海→最寄りの岸に立ってタップした点へ */
  let sec = null;
  if (foot && foot.stand) sec = { stand: foot.stand, brg: foot.bearing, here: "land" };
  else if (foot && foot.sea && foot.shoreD != null && foot.shoreB != null && foot.shoreD <= SEC_AHEAD) {
    const m = metersPerDeg(lat), s = foot.shoreD + 1;
    sec = { stand: { lat: lat + Math.cos(foot.shoreB) * s / m.y, lon: lon + Math.sin(foot.shoreB) * s / m.x },
            brg: (foot.shoreB * 180 / Math.PI + 180) % 360, here: "sea" };
  }
  const c04 = await c04At(plat, plon);
  const M = sec ? await sectionModel(sec.stand, sec.brg, { day, st }) : null;
  if (seq !== analyzeSeq) return;
  if (M) { M.here = sec.here; M.c04 = c04 && c04.here; }
  lastSection = sec;
  const judge = sec ? coastJudge(sec.stand.lat, sec.stand.lon, rockKeys) : coastJudge(plat, plon, rockKeys);   // 海をタップしたら、立つ岸で判定する

  /* 描画 */
  const fmtM = v => v === undefined || v === Infinity ? "—" : (v < 1000 ? Math.round(v) + " m" : (v / 1000).toFixed(1) + " km");
  const maxBar = 3000;
  let html = "";

  html += `<div class="sec"><h3>地点</h3><dl class="kv">
    <dt>座標</dt><dd>${lat.toFixed(5)}, ${lon.toFixed(5)}</dd>
    ${footRow}
    <dt>海岸</dt><dd>${judge.html}${judge.iso ? '<span class="tag iso">地磯</span>' : ""}${judge.note ? `<em>${judge.note}</em>` : ""}</dd>`;
  const place = coast || coastOther;
  if (place && place.f.n) html += `<dt>海岸名</dt><dd>${esc(place.f.n)}</dd>`;
  if (place && place.f.a) html += `<dt>所在地</dt><dd>${esc(place.f.a)}</dd>`;
  if (c04 && c04.names.length) html += `<dt>磯釣り場</dt><dd>${c04.names.slice(0, 3).map(esc).join("、")}<span class="tag est">1987年</span>
    <em>国土数値情報の沿岸メッシュ（この1km区画と隣）に載っている名前</em></dd>`;
  html += `</dl>
    <div class="rowbtns"><button class="btn sm" id="mkSpot">この地点を登録</button>
    <button class="btn sm" id="copyLL">座標をコピー</button></div>
    <div id="spotForm" hidden></div></div>`;

  if (M) {
    html += `<div class="sec"><h3>断面の見込み</h3>${sectionHtml(M)}`;
  } else {
    /* 断面が出せないときは、これまでの「等深線までの距離」で出す */
    const noSec = mode === "inland" ? "" : !foot ? "断面には標高タイルが要る（通信のあるところで一度開けば、その場所は圏外でも出る）"
      : foot.sea ? `岸から${SEC_AHEAD}m以上離れているので断面は出さない。岸の近くの海か、岩の上をタップすると出る` : "";
    html += `<div class="sec"><h3>深さの見込み</h3>`;
    DEPTHS.forEach(d => {
      const v = dd[d];
      const pct = v === undefined || v === Infinity ? 0 : Math.max(2, 100 - Math.min(100, v / maxBar * 100));
      html += `<div class="dbar"><span class="d">${d}m</span><span class="t"><i style="width:${pct}%"></i></span><span class="v">${fmtM(v)}</span></div>`;
    });
    html += `<div class="hintline" style="margin-top:7px">等深線までの水平距離。<b>近いほど急深</b>。
      元データは20m刻みなので磯際の起伏は表していない<span class="tag est">推定の材料</span>${noSec ? "<br>" + noSec : ""}</div>`;
    if (coast && coast.f.s != null) {
      const sl = coast.f.s;
      html += `<dl class="kv" style="margin-top:9px">
        <dt>陸の勾配</dt><dd>${sl}°<span class="tag meas">DEM</span><em>背後の高さ ${coast.f.hm} m</em></dd>
      </dl><div class="hintline">${
        sl >= 35 ? "<b>崖がそのまま海へ落ちている。</b>磯際から水深がある見込み"
      : sl >= 20 ? "そこそこ立った斜面。水中にも続いている見込み"
      : "なだらかな斜面。磯際は浅い見込み"}</div>`;
    }
  }
  html += `<dl class="kv" style="margin-top:9px">
    <dt>底質</dt><dd>${seabed ? esc(seabed.f.a.nature) + `<em>${Math.round(seabed.d)}m先</em>` : '<span class="muted">近傍になし</span>'}</dd>

  const nearShore = !!(foot && (foot.stand || (foot.sea && foot.shoreD != null && foot.shoreD <= SNAP_M)));
  const geo = mode === "dem" ? geometryDem(plat, plon, nearShore)
            : mode === "coast" ? geometryCoast(lat, lon) : null;
  const steep = steepness(dd);
